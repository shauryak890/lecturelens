[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecturelens"
version = "1.0.0"
description = "A citation-grounded RAG study tutor over course PDFs (DSE4150 NLP project)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Unpinned here; exact pins live in requirements.txt.
dependencies = [
    "google-genai",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "pymupdf4llm",
    "sentence-transformers",
    "chromadb",
    "rank-bm25",
    "snowballstemmer",
    "numpy",
    "tenacity",
    "streamlit",
    "typer",
    "rich",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
lecturelens = "lecturelens.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
