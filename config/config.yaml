# config/config.yaml  -  every tunable setting lives here.
# Override any key with an env var: LECTURELENS__SECTION__KEY (e.g. LECTURELENS__LLM__MODEL)

app:
  name: LectureLens
  data_dir: data/raw
  sample_dir: data/sample
  index_dir: data/index
  log_dir: logs
  log_level: INFO

llm:
  provider: gemini                   # gemini | openai_compatible
  api_key_env: GEMINI_API_KEY        # name of env var, never the key itself
  base_url: null                     # only for openai_compatible (e.g. Groq)
  model: gemini-3.8-flash            # VERIFY with `python -m lecturelens models` on build day
  fallback_model: gemini-3.1-flash-lite
  judge_model: gemini-3.1-flash-lite
  timeout_s: 60
  max_retries: 4
  backoff_base_s: 2
  requests_per_minute: 8             # client-side limiter, keep below your AI Studio limit
  thinking_level: low                # null = model default; thinking tokens count as output
  thinking_token_allowance: 1024     # added to each task's max_output_tokens for thinking
  cache:
    enabled: true
    path: data/cache/llm_cache.sqlite
    max_cacheable_temperature: 0.5

prompts:
  path: prompts/prompts.yaml

embeddings:
  provider: local                    # local | gemini
  model: BAAI/bge-small-en-v1.5
  query_instruction: "Represent this sentence for searching relevant passages: "
  batch_size: 32
  normalize: true
  device: cpu
  gemini_model: gemini-embedding-2   # used only if provider == gemini
  gemini_dim: 768

ingestion:
  extensions: [".pdf", ".md", ".txt"]
  chunk_size_tokens: 400
  chunk_overlap_tokens: 60
  min_chunk_tokens: 40
  min_page_chars: 20
  header_footer_threshold: 0.5       # fraction of pages a line must appear on to be stripped
  header_footer_min_pages: 3         # skip header/footer removal on shorter documents
  header_footer_substring_min_chars: 20  # also strip repeated lines this long when glued inside other lines
  use_ocr: true                      # OCR image-only PDF pages (needs rapidocr; slower)
  add_context_header: true           # prepend "file | heading path" to indexed text

retrieval:
  mode: hybrid                       # dense | bm25 | hybrid
  top_k_dense: 20
  top_k_bm25: 20
  rrf_k: 60
  weights: {dense: 1.0, bm25: 1.0}
  rerank: true
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  rerank_candidates: 20
  final_k: 5
  min_rerank_score: -5.0             # below this for ALL candidates -> abstain without LLM
  max_context_tokens: 3000
  bm25:
    k1: 1.5
    b: 0.75
    stemming: false

generation:
  default_mode: concise              # concise | detailed | eli5
  max_words: 180
  max_words_detailed: 450
  history_turns: 3
  repair_on_invalid_citations: true

quiz:
  default_n: 5
  max_n: 15
  default_difficulty: mixed
  context_chunks: 8
  seed: 42                           # seeded option shuffle: the answer is not always A
  dedup_similarity: 0.8              # word-overlap (Jaccard) above which two questions are duplicates

summary:
  n_points: 7
  n_terms: 8
  context_chunks: 10

flashcards:
  default_n: 10
  context_chunks: 8

eval:
  dataset: eval/qa_dataset.jsonl
  output_dir: eval/results
  k_values: [1, 3, 5]
  run_generation_metrics: true
  ablations:
    - {name: bm25_only,        retrieval.mode: bm25,   retrieval.rerank: false}
    - {name: dense_only,       retrieval.mode: dense,  retrieval.rerank: false}
    - {name: hybrid,           retrieval.mode: hybrid, retrieval.rerank: false}
    - {name: hybrid_rerank,    retrieval.mode: hybrid, retrieval.rerank: true}
  chunk_sweep: [200, 400, 600]       # retrieval-only, re-index per value into a temp dir
  minimal_prompt_questions: 10       # questions for the no-grounding-rules prompt ablation
  report_examples: 3                 # successes and failures shown in report.md
